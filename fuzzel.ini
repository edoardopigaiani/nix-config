# fuzzel, the application launcher that replaces the GNOME Activities search.
#
# Installed by desktop.nix as /etc/xdg/fuzzel/fuzzel.ini. fuzzel searches
# XDG_CONFIG_DIRS after the user's own directory (fuzzel.ini(5), FILES), so
# ~/.config/fuzzel/fuzzel.ini still wins.
#
# Colours are "Ayu Dark", as in alacritty.toml, which is the reference copy:
# 253340 is ayu's selection background, and the border's 5c6773 is its UI grey,
# the same one swaylock's idle ring uses. Note the format
# differs from every other file in this repo: fuzzel takes RRGGBBAA with no
# leading '#', so the alpha channel is mandatory. ff is opaque.

# The same face and size as foot, so the launcher looks like a terminal
# overlay rather than a foreign widget: Tamzen's 8x15 strike. pixelsize names
# the strike exactly; a bitmap is only sharp at the sizes it was drawn at.
font=Tamzen:pixelsize=15
dpi-aware=no

# Opens centred, 40% of the screen wide, 12 entries tall. The X395 panel is
# 1920x1080, so that is a ~770px box -- wide enough for long .desktop names
# without becoming a second window.
width=40
lines=12
anchor=center

horizontal-pad=16
vertical-pad=12
inner-pad=8

# No icons: a text-only list, like waybar and yazi.
icons-enabled=no
terminal=foot -e

# Remember what was launched and float it to the top next time.
use-bold=no
layer=overlay

[colors]
# f2 == 95% opaque: enough to read the window underneath as context without
# the text losing contrast.
background=000000f2
text=e6e1cfff
# The matched substring, in ayu's amber -- the same colour foot uses for its
# search matches and jump labels.
match=f29718ff
selection=253340ff
selection-text=e6e1cfff
selection-match=f29718ff
border=5c6773ff

[border]
width=2
# Square, matching waybar and niri's focus ring. GNOME's rounded corners are
# the one visual habit this setup deliberately drops.
radius=0

[key-bindings]
# Ctrl+N/P alongside the arrows, so the launcher moves like readline and like
# the fish pager.
next=Down Control+n
prev=Up Control+p
