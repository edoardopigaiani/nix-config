# fuzzel, the application launcher that replaces the GNOME Activities search.
#
# Installed by desktop.nix as /etc/xdg/fuzzel/fuzzel.ini. fuzzel searches
# XDG_CONFIG_DIRS after the user's own directory (fuzzel.ini(5), FILES), so
# ~/.config/fuzzel/fuzzel.ini still wins.
#
# Colours are "Ayu Classic OLED", as everywhere else; foot's colors-dark in
# terminal.nix is the reference copy. 152e3d is the theme's own selection, the
# same value both terminals highlight with, and the border's 626a73 is its UI
# grey, the hairline swaylock's idle ring and swayosd's border also use. Note
# the format differs from every other file in this repo: fuzzel takes RRGGBBAA
# with no leading '#', so the alpha channel is mandatory. ff is opaque.

# The same face and size as ghostty, so the launcher looks like a terminal
# overlay rather than a foreign widget. fuzzel draws through fcft, so this is
# a fontconfig pattern -- the same syntax foot's font line takes.
#
# size=9 rather than pixelsize: with dpi-aware=no below, fuzzel reads size as
# points, converts at a fixed 96 DPI and multiplies by the output scale, so
# this is the 12 px cell ghostty draws and it follows ghostty if that scale
# ever changes. pixelsize is not scaled and would freeze at one number; it
# was the right call only while this was a bitmap, sharp at its own strikes
# alone.
#
# fontformat=CFF pins the OTF build over the TTF one installed beside it.
# fontconfig already prefers it, but the weight depends on it: FreeType
# darkens CFF outlines only, and the darkening comes from FREETYPE_PROPERTIES
# on fuzzelWrapped in desktop.nix. Hinting is deliberately not set here --
# fuzzel links fcft, fontconfig and FreeType and no GTK, so the hintnone rule
# in terminal.nix's localConf already reaches it.
font=JetBrains Mono:size=9:fontformat=CFF
dpi-aware=no

# Opens centred, 40% of the screen wide, 12 entries tall. The X395 panel is
# 1920x1080, so that is a ~770px box -- wide enough for long .desktop names
# without becoming a second window.
width=40
lines=12
anchor=center

horizontal-pad=16
vertical-pad=12
inner-pad=8

# No icons: a text-only list, like waybar and yazi.
icons-enabled=no

# What runs an entry whose .desktop file says Terminal=true. fuzzel appends
# the command, so this has to end in the flag that takes one: -e for ghostty,
# as it was for foot before it. No --class here, unlike the two terminal
# bindings in niri.kdl -- which program is being launched is not known in
# advance, so there is no useful id to give the window.
terminal=ghostty -e

# Remember what was launched and float it to the top next time.
use-bold=no
layer=overlay

[colors]
# f2 == 95% opaque: enough to read the window underneath as context without
# the text losing contrast.
background=000000f2
text=d9d7d0ff
# The matched substring, in the amber accent -- the same colour foot puts on
# its search box and jump labels, and the theme on its active search match.
match=e6b450ff
selection=152e3dff
selection-text=d9d7d0ff
selection-match=e6b450ff
border=626a73ff

[border]
width=2
# Square, matching waybar and niri's focus ring. GNOME's rounded corners are
# the one visual habit this setup deliberately drops.
radius=0

[key-bindings]
# Ctrl+N/P alongside the arrows, so the launcher moves like readline and like
# the fish pager.
next=Down Control+n
prev=Up Control+p
