# enable_experimental_conpty_backend = false
general.live_config_reload = true

[bell]
animation = "Linear"
# The visual bell never fires -- duration = 0 disables it -- but the colour is
# kept in step with the palette: this is the theme's terminal.foreground, the
# same value [colors.primary] draws text in.
color = '#d9d7d0'
duration = 0

# ------------------------------------------------------------------ colors
# "Ayu Classic OLED", Zed's cut of the newer ayu (zed-extensions/ayu), which
# the editor, foot, Neovim and the whole session chrome are now on. The
# reference copy is foot's colors-dark block in terminal.nix, ported straight
# from the theme's own keys; this file follows it, the direction having
# reversed when the palette changed. It is not the ayu this file used to hold
# -- that was ayu-vim's original dark, and ayu_dark.lua is what is left of it.
#
# The background needs no override any more: the OLED variant's own background
# is pure black. ansi black still follows it rather than taking the theme's
# #01060e, a 1.03:1 glow, so a black cell cannot be told from an empty one.
[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = '#000000'
foreground = '#d9d7d0'   # the theme's terminal.foreground

[colors.cursor]
cursor = '#e6b450'       # ayu's amber accent, the theme's active search match
text   = '#000000'

[colors.vi_mode_cursor]
cursor = '#53bdfa'       # ansi blue, so the mode is obvious at a glance
text   = '#000000'

[colors.selection]
background = '#152e3d'   # players[0].selection, #59c2ff at 24% over black
text       = 'CellForeground'

[colors.search.matches]
background = '#626a73'   # the theme's UI grey: comments, line numbers
foreground = '#d9d7d0'

[colors.search.focused_match]
background = '#e6b450'
foreground = '#000000'

[colors.hints.start]
background = '#e6b450'
foreground = '#000000'

[colors.hints.end]
background = '#152e3d'
foreground = '#d9d7d0'

[colors.footer_bar]
background = '#1b1f29'   # the strip grey, which foot also puts on entry 235
foreground = '#d9d7d0'

# Normal colors
[colors.normal]
# The theme puts #01060e here; overridden to pure black, as the background.
black   = '#000000'
red     = '#ea6c73'
green   = '#91b362'
yellow  = '#f9af4f'      # an orange, in this line of the palette
blue    = '#53bdfa'
magenta = '#d2a6ff'      # and a violet; #f07178 is the bright red below
cyan    = '#90e1c6'
white   = '#c7c7c7'

# Bright colors
[colors.bright]
black   = '#686868'
red     = '#f07178'
green   = '#c2d94c'
yellow  = '#e8c783'
blue    = '#59c2ff'
magenta = '#ddbcff'
cyan    = '#95e6cb'
white   = '#ffffff'

# Dim colors, SGR 2. The theme declares a terminal.ansi.dim_* set of its own,
# so the faint half comes from the palette instead of from Alacritty scaling
# each normal colour down. foot takes the same eight as dim0-7.
[colors.dim]
black   = '#30343d'
red     = '#ad5c62'
green   = '#6e9430'
yellow  = '#b38133'
blue    = '#3f8ac6'
magenta = '#926cb8'
cyan    = '#6ea897'
white   = '#8f908b'

[cursor]
style = "block"
unfocused_hollow = true

[debug]
persistent_logging = false
render_timer = false

[env]
TERM = "xterm-256color"

[font]
# Tamzen is a bitmap, so size is an enum here, not a range: it is sharp only at
# the pixel sizes it was drawn at, one .otb per size -- 9, 12, 13, 14, 15, 16
# and 20 px. Alacritty converts points on a 96 DPI base (pt = px * 0.75), so
# the crisp sizes are 6.75, 9, 9.75, 10.5, 11.25, 12 and 15; anything else
# quietly lands on an interpolated strike instead of erroring.
#
# 11.25 gives the 8x15 strike. eDP-1 is 29x17 cm at 1920x1080 (~166 DPI,
# unscaled), so that is ~2.3 mm tall -- one step below the 8x16 strike, which
# had been chosen to match the old "Terminus (TTF)" at 12 pt (8x17, ~2.6 mm).
size = 11.25

# Unlike Cozette, the style does not pick the strike: every size has the same
# "Regular" and "Bold", and size above alone chooses between them. Plain
# "Tamzen" is used rather than "TamzenForPowerline", since nothing in the
# prompt or tmux draws powerline glyphs.
[font.normal]
family = "Tamzen"
style = "Regular"

[font.bold]
# A real bold bitmap at every size, so bold differs in shape, not just colour.
family = "Tamzen"
style = "Bold"

[font.glyph_offset]
x = 0
y = 0

[font.offset]
x = 0
y = 0

# ------------------------------------------------------------- keybindings
# Only real actions are listed here. The ~100 `chars` bindings this section
# used to hold (arrows, Home/End, F1-F12, PageUp/Down, Backspace, Insert,
# Delete, Tab) merely restated the escape sequences Alacritty already emits
# natively. They came from the pre-0.13 example alacritty.yml, where they
# were commented-out documentation rather than settings.
#
# They were not inert: an explicit `chars` binding takes precedence over
# Alacritty's own key encoding, so it also overrides the kitty keyboard
# protocol that editors negotiate to tell e.g. Ctrl+I from Tab. The F1-F12
# copies were wrong too, encoding Alt as ;6 (which is Ctrl+Shift) and Super
# as ;3 (which is Alt), while the arrows in the same file correctly used ;3
# for Alt.
#
# Ctrl+L is deliberately not bound. Alacritty's defaults pair ClearLogNotice
# with a second binding that sends ^L (form feed) to the shell; restating
# ClearLogNotice here replaced both, so Ctrl+L stopped clearing the screen.
#
# See alacritty-bindings(5) for the full list of defaults.

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "N"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "PasteSelection"
key = "Insert"
mods = "Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Plus"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
action = "Paste"
key = "Paste"

[[keyboard.bindings]]
action = "Copy"
key = "Copy"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "PageUp"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "PageDown"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "U"
mode = "~Alt"
mods = "Shift|Alt"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "D"
mode = "~Alt"
mods = "Shift|Alt"

[mouse]
hide_when_typing = false

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

#[mouse.triple_click]
#threshold = 300

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = false
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

# No need to set the shell: Alacritty uses the login shell, which is fish.
# To force it anyway, note the section was renamed in Alacritty 0.13+:
#[terminal.shell]
#program = "fish"

[window]
decorations = "None"
dynamic_padding = true
dynamic_title = true
startup_mode = "Maximized"
# opacity = 0.85

[window.dimensions]
columns = 0
lines = 0

[window.padding]
x = 10
y = 10

[[hints.enabled]]
command = "xdg-open"
post_processing = true
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.binding]
key = "H"
mods = "Control|Shift"

[hints.enabled.mouse]
enabled = true
mods = "None"
