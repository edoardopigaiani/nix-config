# enable_experimental_conpty_backend = false
general.live_config_reload = true

[bell]
animation = "Linear"
color = '#e6e1cf'
duration = 0

# ------------------------------------------------------------------ colors
# "Ayu Dark", the upstream ayu palette (ayu-theme/ayu-colors), with one
# deliberate departure kept from the theme before it: the background is pure
# black rather than ayu's own #0f1419, and ansi black follows it so a black
# cell cannot be told from the background.
#
# Note what changed in behaviour, not just in hue: Noir Essence Dark defined
# bright == normal in every slot but black, so the setting below only ever
# lifted bold black. ayu gives bright a genuinely different, lighter value in
# all eight slots, so bold text now shifts colour across the whole palette.
[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = '#000000'   # ayu's own is #0f1419; overridden to pure black
foreground = '#e6e1cf'

[colors.cursor]
cursor = '#f29718'       # ayu's signature amber, its editor caret
text   = '#000000'

[colors.vi_mode_cursor]
cursor = '#36a3d9'       # ansi blue, so the mode is obvious at a glance
text   = '#000000'

[colors.selection]
background = '#253340'   # ayu editor.selectionBackground
text       = 'CellForeground'

[colors.search.matches]
background = '#5c6773'   # ayu's UI grey: comments, inactive tabs
foreground = '#e6e1cf'

[colors.search.focused_match]
background = '#f29718'
foreground = '#000000'

[colors.hints.start]
background = '#f29718'
foreground = '#000000'

[colors.hints.end]
background = '#253340'
foreground = '#e6e1cf'

[colors.footer_bar]
background = '#151a1e'   # ayu's panel background, one step off the editor bg
foreground = '#e6e1cf'

# Normal colors
[colors.normal]
# ayu puts #0f1419 here; overridden to pure black to match the background.
black   = '#000000'
red     = '#ff3333'
green   = '#b8cc52'
yellow  = '#e7c547'
blue    = '#36a3d9'
magenta = '#f07178'
cyan    = '#95e6cb'
white   = '#ffffff'

# Bright colors
[colors.bright]
black   = '#323232'
red     = '#ff6565'
green   = '#eafe84'
yellow  = '#fff779'
blue    = '#68d5ff'
magenta = '#ffa3aa'
cyan    = '#c7fffd'
white   = '#ffffff'

[cursor]
style = "block"
unfocused_hollow = true

[debug]
persistent_logging = false
render_timer = false

[env]
TERM = "xterm-256color"

[font]
# Tamzen is a bitmap, so size is an enum here, not a range: it is sharp only at
# the pixel sizes it was drawn at, one .otb per size -- 9, 12, 13, 14, 15, 16
# and 20 px. Alacritty converts points on a 96 DPI base (pt = px * 0.75), so
# the crisp sizes are 6.75, 9, 9.75, 10.5, 11.25, 12 and 15; anything else
# quietly lands on an interpolated strike instead of erroring.
#
# 11.25 gives the 8x15 strike. eDP-1 is 29x17 cm at 1920x1080 (~166 DPI,
# unscaled), so that is ~2.3 mm tall -- one step below the 8x16 strike, which
# had been chosen to match the old "Terminus (TTF)" at 12 pt (8x17, ~2.6 mm).
size = 11.25

# Unlike Cozette, the style does not pick the strike: every size has the same
# "Regular" and "Bold", and size above alone chooses between them. Plain
# "Tamzen" is used rather than "TamzenForPowerline", since nothing in the
# prompt or tmux draws powerline glyphs.
[font.normal]
family = "Tamzen"
style = "Regular"

[font.bold]
# A real bold bitmap at every size, so bold differs in shape, not just colour.
family = "Tamzen"
style = "Bold"

[font.glyph_offset]
x = 0
y = 0

[font.offset]
x = 0
y = 0

# ------------------------------------------------------------- keybindings
# Only real actions are listed here. The ~100 `chars` bindings this section
# used to hold (arrows, Home/End, F1-F12, PageUp/Down, Backspace, Insert,
# Delete, Tab) merely restated the escape sequences Alacritty already emits
# natively. They came from the pre-0.13 example alacritty.yml, where they
# were commented-out documentation rather than settings.
#
# They were not inert: an explicit `chars` binding takes precedence over
# Alacritty's own key encoding, so it also overrides the kitty keyboard
# protocol that editors negotiate to tell e.g. Ctrl+I from Tab. The F1-F12
# copies were wrong too, encoding Alt as ;6 (which is Ctrl+Shift) and Super
# as ;3 (which is Alt), while the arrows in the same file correctly used ;3
# for Alt.
#
# Ctrl+L is deliberately not bound. Alacritty's defaults pair ClearLogNotice
# with a second binding that sends ^L (form feed) to the shell; restating
# ClearLogNotice here replaced both, so Ctrl+L stopped clearing the screen.
#
# See alacritty-bindings(5) for the full list of defaults.

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "N"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "PasteSelection"
key = "Insert"
mods = "Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Plus"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
action = "Paste"
key = "Paste"

[[keyboard.bindings]]
action = "Copy"
key = "Copy"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "PageUp"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "PageDown"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "U"
mode = "~Alt"
mods = "Shift|Alt"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "D"
mode = "~Alt"
mods = "Shift|Alt"

[mouse]
hide_when_typing = false

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

#[mouse.triple_click]
#threshold = 300

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = false
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

# No need to set the shell: Alacritty uses the login shell, which is fish.
# To force it anyway, note the section was renamed in Alacritty 0.13+:
#[terminal.shell]
#program = "fish"

[window]
decorations = "None"
dynamic_padding = true
dynamic_title = true
startup_mode = "Maximized"
# opacity = 0.85

[window.dimensions]
columns = 0
lines = 0

[window.padding]
x = 10
y = 10

[[hints.enabled]]
command = "xdg-open"
post_processing = true
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.binding]
key = "H"
mods = "Control|Shift"

[hints.enabled.mouse]
enabled = true
mods = "None"
