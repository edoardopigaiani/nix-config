# enable_experimental_conpty_backend = false
general.live_config_reload = true

[bell]
animation = "Linear"
color = '#f7f3ea'
duration = 0

# ------------------------------------------------------------------ colors
# "Noir Essence Dark", ported from the VS Code theme of the same name
# (u1145h.u1145h-heme-ark, themes/noir_essence_dark.json). The ANSI slots use
# the theme's own terminal.ansi* mapping, so two quirks below are the theme's
# and not typos: it defines bright == normal for everything but black, and
# being Gruvbox Material derived it puts gruvbox aqua in green and gruvbox
# green in cyan.
[colors]
# The theme gives bright and normal the same values, so this only still
# matters for bright black (bold on a dark grey background).
draw_bold_text_with_bright_colors = true

[colors.primary]
background = '#000000'   # editor.background is #111314; overridden to pure black
foreground = '#f7f3ea'   # terminal.foreground

[colors.cursor]
cursor = '#a9b665'       # terminalCursor.foreground
text   = '#334743'       # terminalCursor.background

[colors.vi_mode_cursor]
cursor = '#7daea3'
text   = '#111314'

[colors.selection]
# terminal.selectionBackground is #f7f3ea10; Alacritty takes no alpha here, so
# this uses editor.selectionBackground, which is the same grey the theme puts
# in ansi black.
background = '#2b2d2d'
text       = 'CellForeground'

[colors.search.matches]
background = '#4f666f'   # editor.findMatchBackground
foreground = '#f7f3ea'

[colors.search.focused_match]
background = '#e78a4e'
foreground = '#111314'

[colors.hints.start]
background = '#e78a4e'
foreground = '#111314'

[colors.hints.end]
background = '#2b2d2d'
foreground = '#f7f3ea'

[colors.footer_bar]
background = '#161819'   # editorWidget.background
foreground = '#f7f3ea'

# Normal colors
[colors.normal]
# The theme puts #2b2d2d here; overridden to pure black to match the background.
black   = '#000000'
red     = '#ea6962'
green   = '#89b482'
yellow  = '#e78a4e'
blue    = '#7daea3'
magenta = '#d3869b'
cyan    = '#a9b665'
white   = '#f7f3ea'

# Bright colors
[colors.bright]
black   = '#434545'
red     = '#ea6962'
green   = '#89b482'
yellow  = '#e78a4e'
blue    = '#7daea3'
magenta = '#d3869b'
cyan    = '#a9b665'
white   = '#f7f3ea'

[cursor]
style = "block"
unfocused_hollow = true

[debug]
persistent_logging = false
render_timer = false

[env]
TERM = "xterm-256color"

[font]
# Cozette is a bitmap, so size is an enum here, not a range: it is sharp only
# at the pixel sizes it was drawn at, and it ships two strikes -- cozette.otb
# at 13 px and cozette_hidpi.otb at 26 px. Alacritty converts points on a
# 96 DPI base, so only 9.75 and 19.5 keep it crisp; anything else interpolates.
#
# 9.75 gives a 6x13 cell. eDP-1 is 29x17 cm at 1920x1080 (~166 DPI, unscaled),
# so that is ~2 mm tall -- a little smaller than the old "Terminus (TTF)" at
# 12 pt (8x17, ~2.6 mm). No 16 px Cozette strike exists, so matching Terminus
# and staying pixel-exact were mutually exclusive.
size = 9.75

[font.normal]
family = "Cozette"
# The style name is what selects the strike: "Medium" is the 13 px cozette.otb,
# "HiDpi" the 26 px cozette_hidpi.otb. It must stay in step with size above,
# because fontconfig matches style and pixel size together and a mismatch does
# not error -- it quietly lands on an interpolated strike.
style = "Medium"

[font.bold]
# Cozette has no bold bitmap; its only bold is the vector CozetteVectorBold,
# whose metrics would not line up with the bitmap cells. So bold points at the
# same strike, and is told apart by brightness alone, via
# draw_bold_text_with_bright_colors in the colors section above.
family = "Cozette"
style = "Medium"

[font.glyph_offset]
x = 0
y = 0

[font.offset]
x = 0
y = 0

# ------------------------------------------------------------- keybindings
# Only real actions are listed here. The ~100 `chars` bindings this section
# used to hold (arrows, Home/End, F1-F12, PageUp/Down, Backspace, Insert,
# Delete, Tab) merely restated the escape sequences Alacritty already emits
# natively. They came from the pre-0.13 example alacritty.yml, where they
# were commented-out documentation rather than settings.
#
# They were not inert: an explicit `chars` binding takes precedence over
# Alacritty's own key encoding, so it also overrides the kitty keyboard
# protocol that editors negotiate to tell e.g. Ctrl+I from Tab. The F1-F12
# copies were wrong too, encoding Alt as ;6 (which is Ctrl+Shift) and Super
# as ;3 (which is Alt), while the arrows in the same file correctly used ;3
# for Alt.
#
# See alacritty-bindings(5) for the full list of defaults.

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "N"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "PasteSelection"
key = "Insert"
mods = "Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Plus"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
action = "Paste"
key = "Paste"

[[keyboard.bindings]]
action = "Copy"
key = "Copy"

[[keyboard.bindings]]
action = "ClearLogNotice"
key = "L"
mods = "Control"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "PageUp"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "PageDown"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "U"
mode = "~Alt"
mods = "Shift|Alt"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "D"
mode = "~Alt"
mods = "Shift|Alt"

[mouse]
hide_when_typing = false

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

#[mouse.triple_click]
#threshold = 300

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = false
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

# No need to set the shell: Alacritty uses the login shell, which is fish.
# To force it anyway, note the section was renamed in Alacritty 0.13+:
#[terminal.shell]
#program = "fish"

[window]
decorations = "None"
dynamic_padding = true
dynamic_title = true
startup_mode = "Maximized"
# opacity = 0.85

[window.dimensions]
columns = 0
lines = 0

[window.padding]
x = 10
y = 10

[[hints.enabled]]
command = "xdg-open"
post_processing = true
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.binding]
key = "H"
mods = "Control|Shift"

[hints.enabled.mouse]
enabled = true
mods = "None"
