# enable_experimental_conpty_backend = false
general.live_config_reload = true

[bell]
animation = "Linear"
color = "#ffffff"
duration = 0

[colors]
draw_bold_text_with_bright_colors = true

# Default colors
[colors.primary]
background = '#000000'
foreground = '#ffffff'

[colors.cursor]
text = '#1d1f21'
cursor = '#c5c8c6'

# Normal colors
[colors.normal]
black   = '#000000'
red     = '#a54242'
green   = '#8c9440'
yellow  = '#de935f'
blue    = '#5f819d'
magenta = '#85678f'
cyan    = '#5e8d87'
white   = '#ffffff'

# Bright colors
[colors.bright]
black   = '#373b41'
red     = '#cc6666'
green   = '#b5bd68'
yellow  = '#f0c674'
blue    = '#81a2be'
magenta = '#b294bb'
cyan    = '#8abeb7'
white   = '#ffffff'

[cursor]
style = "block"
unfocused_hollow = true

[debug]
persistent_logging = false
render_timer = false

[env]
TERM = "xterm-256color"

[font]
size = 11

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.glyph_offset]
x = 0
y = 0

[font.offset]
x = 0
y = 0

# ------------------------------------------------------------- keybindings
# Only real actions are listed here. The ~100 `chars` bindings this section
# used to hold (arrows, Home/End, F1-F12, PageUp/Down, Backspace, Insert,
# Delete, Tab) merely restated the escape sequences Alacritty already emits
# natively. They came from the pre-0.13 example alacritty.yml, where they
# were commented-out documentation rather than settings.
#
# They were not inert: an explicit `chars` binding takes precedence over
# Alacritty's own key encoding, so it also overrides the kitty keyboard
# protocol that editors negotiate to tell e.g. Ctrl+I from Tab. The F1-F12
# copies were wrong too, encoding Alt as ;6 (which is Ctrl+Shift) and Super
# as ;3 (which is Alt), while the arrows in the same file correctly used ;3
# for Alt.
#
# See alacritty-bindings(5) for the full list of defaults.

[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "N"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Paste"
key = "V"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "Copy"
key = "C"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "PasteSelection"
key = "Insert"
mods = "Shift"

[[keyboard.bindings]]
action = "ResetFontSize"
key = "Key0"
mods = "Control"

[[keyboard.bindings]]
action = "IncreaseFontSize"
key = "Plus"
mods = "Control"

[[keyboard.bindings]]
action = "DecreaseFontSize"
key = "Minus"
mods = "Control"

[[keyboard.bindings]]
action = "Paste"
key = "Paste"

[[keyboard.bindings]]
action = "Copy"
key = "Copy"

[[keyboard.bindings]]
action = "ClearLogNotice"
key = "L"
mods = "Control"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "PageUp"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "PageDown"
mode = "~Alt"
mods = "Shift"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "U"
mode = "~Alt"
mods = "Shift|Alt"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "D"
mode = "~Alt"
mods = "Shift|Alt"

[mouse]
hide_when_typing = false

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

#[mouse.triple_click]
#threshold = 300

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = false
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

# No need to set the shell: Alacritty uses the login shell, which is fish.
# To force it anyway, note the section was renamed in Alacritty 0.13+:
#[terminal.shell]
#program = "fish"

[window]
decorations = "None"
dynamic_padding = true
dynamic_title = true
startup_mode = "Maximized"
# opacity = 0.85

[window.dimensions]
columns = 0
lines = 0

[window.padding]
x = 10
y = 10

[[hints.enabled]]
command = "xdg-open"
post_processing = true
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.binding]
key = "H"
mods = "Control|Shift"

[hints.enabled.mouse]
enabled = true
mods = "None"
