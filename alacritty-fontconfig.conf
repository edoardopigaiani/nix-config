<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">

<!-- Fontconfig seen by Alacritty alone, via FONTCONFIG_FILE in the wrapper in
     terminal.nix. FONTCONFIG_FILE replaces the primary config file, so the
     system one is pulled back in first and only then amended; the rest of the
     desktop keeps the stock configuration.

     The amendment hides the glyphs Alacritty would otherwise pick up from
     fallback fonts. Tamzen has no braille, check marks or emoji, so those come
     from DejaVu Sans at full size, where they tower over the 6x12 bitmap.

     A matrix on the font pattern is the only lever available. Alacritty has no
     per-fallback size, and pixelsize cannot be edited per font because
     crossfont passes the requested size to FT_Set_Char_Size itself and ignores
     the pattern's. It does read the pattern matrix and hands it to
     FT_Outline_Transform (src/ft/mod.rs, face_from_pattern), after calling
     render_prepare on each fallback pattern, which is what applies the rule
     below.

     XML comments cannot contain a double hyphen, hence the unbroken prose. -->
<fontconfig>
  <include>/etc/fonts/fonts.conf</include>

  <!-- FT_Outline_Transform only touches FT_GLYPH_FORMAT_OUTLINE glyphs, so a
       fallback that is a bitmap strike would come through at full size and
       defeat the matrix. Tamzen is itself such a font, so the pair below is
       ordered rather than negated: FcConfigAcceptFont tests the accept list
       first and returns early, so Tamzen survives while Cozette, the Terminus
       PCFs and TamzenForPowerline leave Alacritty's font set entirely and can
       never be chosen as a fallback. Everything that remains is scalable and
       therefore shrinkable.

       Colour emoji are not a hole here: DejaVu Sans carries U+1F600 as a real
       outline and outranks NotoColorEmoji in the sort, so emoji arrive as
       shrinkable outlines too. -->
  <selectfont>
    <acceptfont>
      <pattern><patelt name="family"><string>Tamzen</string></patelt></pattern>
    </acceptfont>
    <rejectfont>
      <pattern><patelt name="scalable"><bool>false</bool></patelt></pattern>
    </rejectfont>
  </selectfont>

  <!-- Everything that is not the primary family, i.e. every fallback. qual=all
       is what makes it safe: a font whose family list holds Tamzen under any
       name is left alone. Keep this string in sync with font.normal.family in
       alacritty.toml.

       0.01 renders nothing. Measured on DejaVu Sans at 12px with FreeType: at
       1.0 a check mark is an 8x7 bitmap, at 0.35 a legible 3x3, at 0.01 a 1x2
       bitmap whose every coverage byte is zero, which Alacritty blends as fully
       transparent. A plain 0.0 collapses the bitmap to 0x0 and is equally
       invisible, but 0.01 keeps the geometry non-degenerate for no cost.
       Raise toward 0.35 for "tiny but there", toward 1.0 for legible.

       Cell metrics do not change at any scale: nothing reflows, the glyphs just
       stop being drawn. The cell stays blank rather than showing a missing
       glyph box, since from Alacritty's side the fallback was found. -->
  <match target="font">
    <test name="family" compare="not_eq" qual="all"><string>Tamzen</string></test>
    <edit name="matrix" mode="assign">
      <matrix>
        <double>0.01</double><double>0</double>
        <double>0</double><double>0.01</double>
      </matrix>
    </edit>
  </match>
</fontconfig>
