# mako, the notification daemon that replaces gnome-shell's notifications.
# This is what notify-send -- and so weechat's notify_send.py -- draws with
# once GNOME is gone.
#
# Unlike every other tool in this setup, mako has NO system-wide config path:
# mako(5) documents only ~/.config/mako/config and $XDG_CONFIG_HOME/mako/config,
# and the binary contains no /etc fallback. desktop.nix therefore links this
# file into ~/.config/mako/config with systemd.tmpfiles, the same mechanism
# terminal.nix already uses for micro's colorscheme. The consequence worth
# knowing: the link is forced on every rebuild, so edit this file, not the one
# in ~/.config.
#
# Colours are "Noir Essence Dark", as everywhere else; foot's colors-dark in
# terminal.nix is the reference copy. The low-urgency text is the one role
# that is not an ANSI slot or a panel grey: it is the theme's
# statusBar.foreground, #f7f3ea95, written with its alpha and left for mako
# to compose -- unlike Neovim and the console, mako takes #RRGGBBAA, so the
# value needs no flattening here. Over the notification's own grey it comes
# out at #999893, 6.16:1. The two greys that would have been the obvious
# picks are both unreadable as body text: the border's 434545 is 1.85:1 on
# that grey and the theme's comment colour (51504d) is 2.21:1.

# JetBrains Mono at 12px, as waybar, swayosd and swaylock; foot draws the
# same face at 9 pt, which is this same 12 px at the display's scale.
# fontconfig picks its OTF (CFF) build, which is what the stem darkening set
# on mako's unit in desktop.nix needs for the macOS-like weight.
font=JetBrains Mono 12px

# Top right, below waybar: the bar is 26px tall (height in desktop.nix) and
# draws no surface of its own, so 8px of margin is clear of it either way.
anchor=top-right
margin=8
padding=12
width=380
height=160

# The strip grey, the same one foot puts on palette entry 235, rather than
# the terminal background, so a notification reads as a panel floating over
# the session. f2 == 95%.
background-color=#161819f2
text-color=#f7f3ea
border-color=#434545
border-size=2
# 8px, the radius niri.kdl rounds windows to; fuzzel.ini says why the four
# chrome surfaces follow it. mako rounds the border and the fill together,
# so the notification reads as one panel.
border-radius=8

# The accent on the progress bar some notifications carry (volume, brightness).
progress-color=over #2b2d2d

# Markup is on by default and weechat's notifications are plain text, but
# keeping it explicit documents that <b>/<i> work here.
markup=1
format=<b>%s</b>\n%b

default-timeout=5000
ignore-timeout=0

# Newest at the top, at most 5 on screen; the rest queue and the counter in
# the last one says how many are waiting.
sort=-time
max-visible=5

# Clicking dismisses, middle-click dismisses all. GNOME's notification drawer
# has no equivalent here: `makoctl restore` brings back the last dismissed one.
on-button-left=dismiss
on-button-middle=dismiss-all
on-button-right=invoke-default-action

[urgency=low]
text-color=#f7f3ea95
default-timeout=3000

[urgency=normal]
border-color=#434545

# Critical notifications never time out and are bordered in the palette's red.
# This is what a failed systemd unit or a nearly empty battery looks like.
[urgency=critical]
border-color=#ea6962
text-color=#f7f3ea
default-timeout=0
