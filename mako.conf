# mako, the notification daemon that replaces gnome-shell's notifications.
# This is what notify-send -- and so weechat's notify_send.py -- draws with
# once GNOME is gone.
#
# Unlike every other tool in this setup, mako has NO system-wide config path:
# mako(5) documents only ~/.config/mako/config and $XDG_CONFIG_HOME/mako/config,
# and the binary contains no /etc fallback. desktop.nix therefore links this
# file into ~/.config/mako/config with systemd.tmpfiles, the same mechanism
# terminal.nix already uses for micro's colorscheme. The consequence worth
# knowing: the link is forced on every rebuild, so edit this file, not the one
# in ~/.config.
#
# Colours are "Noir Essence Dark", as in alacritty.toml.

# Tamzen at its 8x15 strike, like the terminals and waybar. mako draws with
# Pango, which loads only the OTB build of a bitmap font (Tamzen ships one),
# and "15px" is an absolute size, so it names the strike exactly.
font=Tamzen 15px

# Top right, below waybar: the bar is ~24px tall, and 8px of margin clears it.
anchor=top-right
margin=8
padding=12
width=380
height=160

# Matches the palette's widget background rather than the terminal background,
# so a notification reads as a panel floating over the session. f2 == 95%.
background-color=#161819f2
text-color=#f7f3ea
border-color=#434545
border-size=2
# Square, like waybar and fuzzel.
border-radius=0

# The accent on the progress bar some notifications carry (volume, brightness).
progress-color=over #2b2d2d

# Markup is on by default and weechat's notifications are plain text, but
# keeping it explicit documents that <b>/<i> work here.
markup=1
format=<b>%s</b>\n%b

default-timeout=5000
ignore-timeout=0

# Newest at the top, at most 5 on screen; the rest queue and the counter in
# the last one says how many are waiting.
sort=-time
max-visible=5

# Clicking dismisses, middle-click dismisses all. GNOME's notification drawer
# has no equivalent here: `makoctl restore` brings back the last dismissed one.
on-button-left=dismiss
on-button-middle=dismiss-all
on-button-right=invoke-default-action

[urgency=low]
text-color=#434545
default-timeout=3000

[urgency=normal]
border-color=#434545

# Critical notifications never time out and are bordered in the palette's red.
# This is what a failed systemd unit or a nearly empty battery looks like.
[urgency=critical]
border-color=#ea6962
text-color=#f7f3ea
default-timeout=0
